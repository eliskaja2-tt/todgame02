<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>心士林 TOD</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;background:#fff4e6;color:#4a3426;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#ff8fa3;color:#fff;font-weight:800;font-size:16px;box-shadow:0 2px 8px #0002}
header small{display:block;font-size:10px;font-weight:600;opacity:.9}
#scene{position:relative;overflow:hidden;border-radius:0 0 24px 24px;line-height:0}
#scene img{width:100%;display:block}
#people{position:absolute;inset:0;line-height:1}
.cloud{position:absolute;top:6%;font-size:30px;animation:drift 40s linear infinite}
.balloon{position:absolute;left:8%;bottom:30%;font-size:26px;animation:float 3s ease-in-out infinite}
@keyframes drift{from{left:-12%}to{left:110%}}
@keyframes float{50%{transform:translateY(-12px) rotate(6deg)}}
.p{position:absolute;pointer-events:none}
.p span{display:block;animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px) rotate(6deg)}}
#go{display:block;margin:-22px auto 0;position:relative;z-index:5;width:80%;padding:14px;border:0;border-radius:40px;background:linear-gradient(#ffd166,#ffa62b);color:#5a3200;font-size:20px;font-weight:900;box-shadow:0 5px 0 #d9831a,0 8px 14px #0003}
#go:active{transform:translateY(4px);box-shadow:0 1px 0 #d9831a}
#combo{text-align:center;height:18px;font-size:13px;font-weight:800;color:#e0680a;margin-top:6px}
.tip{text-align:center;font-size:12px;margin:2px 14px 4px;opacity:.75}
.floor{margin:8px 8px 14px;padding:6px 6px 8px;background:#ffe9cf;border-radius:18px;position:relative}
.fl{font-weight:900;font-size:13px;color:#fff;background:#c98a5a;display:inline-block;padding:1px 12px;border-radius:10px;margin:0 0 6px 4px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card{background:#fff;border-radius:14px;padding:5px;box-shadow:0 2px 6px #0001;text-align:center;position:relative;min-width:0}
.frame{position:relative;padding:5px;border-radius:11px}
.t0{background:#d8d2cc}
.t1{background:linear-gradient(135deg,#f0b27a,#a85d24 50%,#f0b27a)}
.t2{background:linear-gradient(135deg,#fff,#a9b4c2 50%,#fff);box-shadow:0 0 8px #9fb2cc}
.t3,.t4{background:linear-gradient(135deg,#fff3a0,#f2b705 40%,#fff3a0 60%,#f2b705);background-size:250% 250%;animation:shine 2.5s linear infinite;box-shadow:0 0 12px #ffd54a}
@keyframes shine{to{background-position:100% 100%}}
.crown{display:none;position:absolute;top:-20px;left:50%;font-size:24px;transform:translateX(-50%);z-index:3;animation:bounce 1.2s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0003)}
.t4 .crown{display:block}
@keyframes bounce{50%{transform:translateX(-50%) translateY(-5px) rotate(-6deg)}}
.store{position:relative;height:84px;border-radius:7px;overflow:hidden;background:linear-gradient(#fffaf0,#ffeccf)}
.t0 .store{background:#eee7df}
.awn{height:15px;background:repeating-linear-gradient(90deg,var(--c,#ccc) 0 10px,#fff 10px 20px);border-radius:0 0 8px 8px}
.t0 .awn{filter:grayscale(1) opacity(.4)}
.ico{font-size:30px;line-height:1;margin-top:6px;animation:bob 1s ease-in-out infinite alternate}
.t0 .ico{display:none}
.plus{display:none;font-size:30px;margin-top:12px;color:#b9a99a;font-weight:900}.t0 .plus{display:block}
.door{position:absolute;left:50%;bottom:0;width:20px;height:25px;margin-left:-10px;background:#7a5238;border-radius:9px 9px 0 0;box-shadow:inset 0 0 0 2px #a67a58}
.lane{position:absolute;inset:0;line-height:1}
.nm{font-weight:800;margin:5px 0 3px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stk{height:6px;background:#eee;border-radius:5px;overflow:hidden}
.stk i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fdca0,#2fb872);transition:width .3s}
.sn{font-size:10px;margin:2px 0 4px;opacity:.75;white-space:nowrap}
.btns{display:flex;flex-direction:column;gap:4px}
.btns button{border:0;border-radius:10px;padding:7px 1px;font-size:11px;font-weight:800;color:#fff;background:#8bd0a0;box-shadow:0 2px 0 #0002}
.btns button.up{background:#ff8fa3}.btns button.op{background:#ffa62b}
.btns button.can{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 8px #ff8fa3}}
.btns button:disabled{background:#cfc8c2;color:#fff9;box-shadow:none}
.btns button:active:not(:disabled){transform:translateY(2px)}
.pop{position:absolute;pointer-events:none;font-weight:900;color:#e08a00;text-shadow:0 1px 0 #fff,0 0 4px #fff;z-index:9;animation:up 1s ease-out forwards;font-size:13px}
@keyframes up{to{transform:translateY(-38px);opacity:0}}
#pk{display:none;position:fixed;inset:0;z-index:50;background:#0006;align-items:flex-end}
#pk.on{display:flex}
#sheet{width:100%;background:#fff8ef;border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
#sheet h3{margin:0 0 10px;text-align:center}
.opt{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;padding:10px;margin-bottom:8px;background:#fff;box-shadow:0 2px 0 #0002;text-align:left;font-size:14px;color:#4a3426}
.opt b{font-size:15px}.opt .e{font-size:30px}.opt small{display:block;opacity:.7;font-size:11px}
.opt .pr{margin-left:auto;font-weight:900;color:#e0680a;white-space:nowrap}
.opt:disabled{opacity:.45}
#cx{display:block;margin:6px auto 0;background:none;border:0;color:#a08b7c;font-size:14px}
#fwbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,5,30,.6)}
#fwbox.on{display:block}
#fwbox canvas{position:absolute;inset:0}
#fwt{position:absolute;top:22%;width:100%;text-align:center;color:#ffe66d;font-size:30px;font-weight:900;text-shadow:0 0 12px #ff6b9d;animation:bounce2 1s infinite alternate;pointer-events:none}
#fwt small{display:block;font-size:14px;color:#fff;margin-top:8px}
@keyframes bounce2{to{transform:scale(1.07)}}
#rs{display:block;margin:10px auto;background:none;border:0;color:#a08b7c;font-size:12px;text-decoration:underline}
</style></head><body>

<script>
const T=[
 {n:'手搖飲',e:'🧋',c:40,b:4,col:'#ff9ec4'},
 {n:'咖啡店',e:'☕',c:120,b:7,col:'#e0a370'},

 {n:'餐廳',e:'🍽️',c:1200,b:30,col:'#ffb36b'},
 {n:'小酒館',e:'🍻',c:2500,b:55,col:'#f2c14e'},
 {n:'捷米專賣店',e:'🚇',c:5000,b:100,col:'#4fa3ff',jemi:1}];
const MULT=[0,1,2.5,6,14],UP=[0,0,2,6,15],FI=[1,1.15,1.3,1.5],FC=[1,1.2,1.5,2],TIER=['','銅','銀','金','金+皇冠'],TH=[6,14,24,34,44];
const PEOPLE=['🧒','👧','👦','👩','👨','🧓','👵','🧑‍🎓','👩‍🦰','🧑‍🦱','🐕','👶'];
const KEY='shilin-tod-v3';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.shops||S.shops.length!==12)S={coins:0,won:0,jemi:0,shops:Array.from({length:12},()=>({t:-1,lv:0,st:0}))};
const $=s=>document.querySelector(s),rnd=a=>a[Math.random()*a.length|0];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fl=i=>i/3|0,fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n);
const ocost=(i,t)=>Math.round(T[t].c*FC[fl(i)]);
const ucost=(i,L)=>Math.round(T[S.shops[i].t].c*UP[L]*FC[fl(i)]);
const rcost=i=>Math.max(5,Math.round(T[S.shops[i].t].c*.08));
const inc=i=>{const s=S.shops[i];return s.t<0?0:Math.round(T[s.t].b*MULT[s.lv]*FI[fl(i)])};
const openN=()=>S.shops.filter(s=>s.t>=0).length;
const jemiLv=()=>{const s=S.shops.find(s=>s.t===6);return s?s.lv:0};
function walk(parent,from,to,bottom,size,dur,end){
  const p=document.createElement('div');p.className='p';p.style.cssText=`bottom:${bottom};font-size:${size}px`;
  p.innerHTML='<span>'+rnd(PEOPLE)+'</span>';parent.appendChild(p);
  const f=from<to?1:-1,t=s=>`translateX(-50%) scaleX(${f}) scale(${s})`;
  p.animate([{left:from+'%',opacity:1,transform:t(1)},{left:to+'%',opacity:1,transform:t(.85),offset:.88},{left:to+'%',opacity:0,transform:t(.2)}],{duration:dur,easing:'linear'}).onfinish=()=>{p.remove();end&&end()};
}
function pop(parent,txt,x,y,fixed){const e=document.createElement('div');e.className='pop';e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';if(fixed)e.style.position='fixed';parent.appendChild(e);setTimeout(()=>e.remove(),1000)}
// 建立樓層 5F→2F
const fe=$('#floors');
for(let f=3;f>=0;f--){
  const d=document.createElement('div');d.className='floor';
  d.innerHTML=`<div class="fl">${f+2}F</div><div class="row">${[0,1,2].map(k=>{const i=f*3+k;return `<div class="card" id="c${i}"><div class="frame"><div class="crown">👑</div><div class="store"><div class="awn"></div><div class="ico"></div><div class="plus">＋</div><div class="door"></div><div class="lane"></div></div></div><div class="nm"></div><div class="stk"><i></i></div><div class="sn"></div><div class="btns"><button class="op"></button><button class="up"></button></div></div>`}).join('')}</div>`;
  fe.appendChild(d);
}
S.shops.forEach((sh,i)=>{const d=$('#c'+i);
  d.querySelector('.store').onclick=()=>{if(S.shops[i].t<0)openPicker(i)};
  d.querySelector('.op').onclick=()=>{const sh=S.shops[i];
    if(sh.t<0)return openPicker(i);
    if(S.coins>=rcost(i)&&sh.st<20){S.coins-=rcost(i);sh.st=Math.min(20,sh.st+10)}render()};
  d.querySelector('.up').onclick=()=>{const sh=S.shops[i];
    if(sh.t>=0&&sh.lv<4&&S.coins>=ucost(i,sh.lv+1)){S.coins-=ucost(i,sh.lv+1);sh.lv++;pop(d,['','','🥈升級!','🥇升級!','👑滿級!'][sh.lv],20,20)}render()};
});
// 選店種
let pick=-1;
function openPicker(i){pick=i;const un=S.jemi||openN()>=5;

    const has=t.jemi&&S.shops.some(s=>s.t===6),lock=t.jemi&&!un,c=ocost(i,k);
    const sub=lock?'🔒 先開滿 5 間店才能解鎖':has?'已經開過了（全商場限 1 間）':`每位客人約 +${Math.round(t.b*FI[fl(i)])}`+(t.jemi?'｜每級招攬 +8':'');
    return `<button class="opt" data-k="${k}" ${lock||has||S.coins<c?'disabled':''}><span class="e">${t.e}</span><span><b>${t.n}</b><small>${sub}</small></span><span class="pr">💰${c}</span></button>`}).join('');

  $('#pk').classList.remove('on');pop($('#c'+i),'🎉開張!',15,20);render()};
$('#cx').onclick=()=>$('#pk').classList.remove('on');

  const[tot,st]=stars();$('#stars').textContent='⭐ '+st+'/5';
  const nx=TH.find(x=>tot<x);
  $('#tip').textContent=(S.jemi?'🚇 捷米專賣店已解鎖！':`開滿 5 間店解鎖 🚇 捷米專賣店（${openN()}/5）`)+(nx?`｜總等級 ${tot}/${nx} 再拿一顆星`:'');
  $('#go').textContent='📣 招攬客人 +'+(10+jemiLv()*8);
  S.shops.forEach((sh,i)=>{const d=$('#c'+i),t=T[sh.t],op=d.querySelector('.op'),up=d.querySelector('.up');
    d.querySelector('.frame').className='frame t'+(sh.t<0?0:sh.lv);
    d.querySelector('.store').style.setProperty('--c',t?t.col:'#ccc');
    d.querySelector('.ico').textContent=t?t.e:'';
    d.querySelector('.stk i').style.width=sh.st*5+'%';
    op.classList.remove('can');up.classList.remove('can');
    if(sh.t<0){d.querySelector('.nm').textContent='空店面';d.querySelector('.sn').textContent='點擊選店種';op.textContent='🏪 開店';op.disabled=false;up.textContent='—';up.disabled=true}
    else{d.querySelector('.nm').textContent=t.n;
      d.querySelector('.sn').textContent=sh.st?`${TIER[sh.lv]}｜庫${sh.st}｜+${inc(i)}`:'⚠️ 缺貨';
      op.textContent='📦 進貨 '+rcost(i);op.disabled=S.coins<rcost(i)||sh.st>=20;
      if(sh.st===0&&!op.disabled)op.classList.add('can');
      if(sh.lv<4){const c=ucost(i,sh.lv+1);up.textContent='⬆'+['','銀','金','皇冠'][sh.lv]+' '+fmt(c);up.disabled=S.coins<c;if(!up.disabled)up.classList.add('can')}
      else{up.textContent='👑 滿級';up.disabled=true}}
  });
  if(st>=5&&!S.won){S.won=1;fireworks()}
  save();
}
function spawnScene(){const l=Math.random()<.5;walk($('#people'),l?-4:104,49,'7%',20+Math.random()*6,2600+Math.random()*1200)}
let combo=0,last=0;
$('#go').onclick=e=>{const now=Date.now();combo=now-last<900?combo+1:1;last=now;
  const m=Math.min(3,1+Math.floor(combo/4)*.5),g=Math.round((10+jemiLv()*8)*m);
  S.coins+=g;for(let k=0;k<2;k++)setTimeout(spawnScene,k*250);
  pop(document.body,'+'+g,e.clientX-10,e.clientY-30,1);
  $('#combo').textContent=m>1?`🔥 連擊 x${m}`:'';render()};
setInterval(()=>{if(Date.now()-last>1200)$('#combo').textContent=''},500);
function tick(){
  spawnScene();
  const open=S.shops.map((s,i)=>i).filter(i=>S.shops[i].t>=0&&S.shops[i].st>0);
  const n=1+Math.floor(openN()/4);
  for(let k=0;k<n&&open.length;k++){const i=open.splice(Math.random()*open.length|0,1)[0],d=$('#c'+i);
    walk(d.querySelector('.lane'),Math.random()<.5?-10:110,50,'2px',16,1600,()=>{const sh=S.shops[i];if(sh.st<=0)return;sh.st--;S.coins+=inc(i);pop(d,'+'+fmt(inc(i)),20,25);render()})}
  setTimeout(tick,Math.max(450,1400-stars()[0]*20));
}
// 煙火
const cv=$('#cv'),cx=cv.getContext('2d');let P=[],fwEnd=0,fwRun=0;
function burst(x,y){const h=Math.random()*360,n=70;for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.2,s=1.5+Math.random()*4;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:h+Math.random()*40})}}
function fwLoop(){
  cx.globalCompositeOperation='destination-out';cx.fillStyle='rgba(0,0,0,.18)';cx.fillRect(0,0,cv.width,cv.height);
  cx.globalCompositeOperation='lighter';
  P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.985;p.l-=.012;cx.fillStyle=`hsla(${p.h},100%,60%,${p.l})`;cx.beginPath();cx.arc(p.x,p.y,2.2,0,7);cx.fill()});
  if(Date.now()<fwEnd&&Math.random()<.06)burst(Math.random()*cv.width,Math.random()*cv.height*.6+40);
  if(fwRun)requestAnimationFrame(fwLoop)}
function fireworks(){cv.width=innerWidth;cv.height=innerHeight;$('#fwbox').classList.add('on');P=[];fwEnd=Date.now()+12000;fwRun=1;
  for(let k=0;k<5;k++)setTimeout(()=>burst(Math.random()*cv.width,Math.random()*cv.height*.5+60),k*300);fwLoop()}
$('#fwbox').onclick=()=>{fwRun=0;$('#fwbox').classList.remove('on')};
$('#rs').onclick=()=>{if(confirm('確定要重新開始嗎？')){localStorage.removeItem(KEY);location.reload()}};
render();tick();
</script></body></html>
