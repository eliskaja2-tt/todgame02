*{touch-action:manipulation;-webkit-touch-callout:none;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;background:#fff4e6;color:#4a3426}
.cn{display:inline-block;width:1.1em;height:1.1em;background:var(--cn) center/contain no-repeat;vertical-align:-.2em;margin-right:2px}
header{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(7px + env(safe-area-inset-top)) 12px 7px;background:#ff8fa3;color:#fff;font-weight:800;font-size:16px}
header .ti{font-size:15px;line-height:1.1}header small{display:block;font-size:10px;font-weight:600;opacity:.9}
.chip{background:#fff3;border-radius:14px;padding:4px 10px;white-space:nowrap}
#coinchip{font-size:18px;background:#fff4;transition:transform .15s}
#scene{flex:none;position:relative;height:22dvh;min-height:130px;overflow:hidden;line-height:0}
#scene img{width:100%;height:100%;object-fit:cover;object-position:center 60%;display:block}
#people{position:absolute;inset:0;line-height:1}
.cloud{position:absolute;top:5%;font-size:26px;animation:drift 40s linear infinite}
.balloon{position:absolute;left:6%;bottom:35%;font-size:22px;animation:float 3s ease-in-out infinite}
@keyframes drift{from{left:-12%}to{left:110%}}
@keyframes float{50%{transform:translateY(-10px) rotate(6deg)}}
.p{position:absolute;pointer-events:none}
.p span{display:block;animation:bob .35s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px) rotate(6deg)}}
#combo{position:absolute;right:8px;top:8px;line-height:1;background:#ff6b3d;color:#fff;font-weight:900;font-size:13px;padding:4px 10px;border-radius:12px;display:none}
.bar{flex:none;padding:8px 12px 2px;display:flex;gap:8px}
#go{display:block;flex:1;min-width:0;padding:12px;border:0;border-radius:30px;background:linear-gradient(#ffd166,#ffa62b);color:#5a3200;font-size:19px;font-weight:900;box-shadow:0 4px 0 #d9831a}
#tr{flex:none;width:106px;border:0;border-radius:30px;background:linear-gradient(#6cc4ff,#3a8de0);color:#fff;font-size:14px;font-weight:900;box-shadow:0 4px 0 #2a6cb0;line-height:1.15}
#tr:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #2a6cb0}
#tr.rdy{animation:pulse 1.2s ease-in-out infinite}
#tr:disabled{background:#cfc8c2;box-shadow:0 4px 0 #b5aca5;color:#fff}
#tr.on{background:linear-gradient(#ffd166,#ffa62b);color:#5a3200;box-shadow:0 4px 0 #d9831a}
#train{position:absolute;display:none;left:112%;top:33%;font-size:20px;line-height:1;white-space:nowrap;transform:translate(-50%,-50%) rotate(-16deg);z-index:3;filter:drop-shadow(0 2px 2px #0004)}
#rush{position:absolute;left:8px;top:8px;line-height:1;background:#3a8de0;color:#fff;font-weight:900;font-size:13px;padding:4px 10px;border-radius:12px;display:none;animation:b2 .8s infinite alternate}
#go:active{transform:translateY(3px);box-shadow:0 1px 0 #d9831a}
.tip{flex:none;text-align:center;font-size:11px;padding:3px 10px;opacity:.75}
#main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 12px 8px}
.fp{display:none}.fp.on{display:block}
.card{display:grid;grid-template-columns:106px 1fr;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:8px;margin-bottom:20px;box-shadow:0 3px 8px #0001;position:relative}
.frame{position:relative;padding:5px;border-radius:12px}
.t0{background:#d8d2cc}
.t1{background:linear-gradient(135deg,#f0b27a,#a85d24 50%,#f0b27a)}
.t2{background:linear-gradient(135deg,#fff,#a9b4c2 50%,#fff);box-shadow:0 0 8px #9fb2cc}
.t3,.t4{background:linear-gradient(135deg,#fff3a0,#f2b705 40%,#fff3a0 60%,#f2b705);background-size:250% 250%;animation:shine 2.5s linear infinite;box-shadow:0 0 12px #ffd54a}
@keyframes shine{to{background-position:100% 100%}}
.crown{display:none;position:absolute;top:-24px;left:50%;font-size:28px;transform:translateX(-50%);z-index:3;animation:bounce 1.2s ease-in-out infinite;filter:drop-shadow(0 2px 2px #0003)}
.t4 .crown{display:block}
@keyframes bounce{50%{transform:translateX(-50%) translateY(-5px) rotate(-6deg)}}
.store{position:relative;height:88px;border-radius:8px;overflow:hidden;background:linear-gradient(#fffaf0,#ffeccf)}
.t0 .store{background:#eee7df}
.store.jm{background:#fff var(--jm) center/cover no-repeat}
.jm .awn,.jm .ico,.jm .door{display:none}
.awn{height:16px;background:repeating-linear-gradient(90deg,var(--c,#ccc) 0 10px,#fff 10px 20px);border-radius:0 0 8px 8px}
.t0 .awn{filter:grayscale(1) opacity(.4)}
.ico{font-size:32px;line-height:1;margin-top:7px;text-align:center;animation:bob 1s ease-in-out infinite alternate}
.t0 .ico{display:none}
.plus{display:none;font-size:34px;text-align:center;margin-top:16px;color:#b9a99a;font-weight:900}.t0 .plus{display:block}
.door{position:absolute;left:50%;bottom:0;width:22px;height:27px;margin-left:-11px;background:#7a5238;border-radius:10px 10px 0 0;box-shadow:inset 0 0 0 2px #a67a58}
.lane{position:absolute;inset:0;line-height:1}
.nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-size:11px;font-weight:700;color:#c98a5a;margin-left:4px}
.stk{height:8px;background:#eee;border-radius:5px;overflow:hidden;margin:6px 0 3px}
.stk i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fdca0,#2fb872);transition:width .3s}
.sn{font-size:12px;opacity:.8;margin-bottom:7px;white-space:nowrap}
.btns{display:flex;gap:6px}
.btns button{flex:1;border:0;border-radius:12px;padding:11px 2px;font-size:13px;font-weight:800;color:#fff;background:#ffa62b;box-shadow:0 3px 0 #0002;white-space:nowrap}
.btns button.up{background:#ff8fa3}
.btns button.can{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 10px #ff8fa3}}
.btns button:disabled{background:#cfc8c2;color:#fff9;box-shadow:none}
.btns button:active:not(:disabled){transform:translateY(2px)}
.pop{position:absolute;pointer-events:none;font-weight:900;color:#e08a00;text-shadow:0 1px 0 #fff,0 0 4px #fff,0 0 4px #fff;z-index:9;animation:up 1s ease-out forwards;font-size:15px;white-space:nowrap}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;box-shadow:0 -2px 10px #0002;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:6px}
nav button{position:relative;border:0;border-radius:14px;background:#fff1e0;padding:6px 0;font-size:18px;font-weight:900;color:#a0724a;line-height:1.1}
nav button small{display:block;font-size:11px;font-weight:700;opacity:.8}
nav button.on{background:#ff8fa3;color:#fff}
nav button.dot::after{content:"";position:absolute;top:4px;right:10px;width:10px;height:10px;border-radius:50%;background:#ff3b3b;border:2px solid #fff}
#pk{display:none;position:fixed;inset:0;z-index:50;background:#0006;align-items:flex-end}
#pk.on{display:flex}
#sheet{width:100%;background:#fff8ef;border-radius:22px 22px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));max-height:82dvh;overflow:auto}
#sheet h3{margin:0 0 10px;text-align:center}
.opt{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;padding:10px;margin-bottom:8px;background:#fff;box-shadow:0 2px 0 #0002;text-align:left;font-size:14px;color:#4a3426}
.opt b{font-size:15px}.opt .e{font-size:30px;width:40px;text-align:center}.opt small{display:block;opacity:.7;font-size:11px}
.opt .pr{margin-left:auto;font-weight:900;color:#e0680a;white-space:nowrap}
.opt:disabled{opacity:.45}
.jmimg{display:block;width:40px;height:40px;border-radius:50%;background:var(--ji) center/cover;border:2px solid #4fa3ff}
.jmimg.s{display:inline-block;width:20px;height:20px;border-width:1px;vertical-align:-5px;margin-right:4px}
#cx{display:block;margin:6px auto 0;background:none;border:0;color:#a08b7c;font-size:14px;padding:8px}
#fwbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,5,30,.6)}
#fwbox.on{display:block}
#fwbox canvas{position:absolute;inset:0}
#fwt{position:absolute;top:22%;width:100%;text-align:center;color:#ffe66d;font-size:30px;font-weight:900;text-shadow:0 0 12px #ff6b9d;animation:b2 1s infinite alternate;pointer-events:none}
#fwt small{display:block;font-size:14px;color:#fff;margin-top:8px}
@keyframes b2{to{transform:scale(1.07)}}
#rs{display:block;margin:6px auto 16px;background:none;border:0;color:#a08b7c;font-size:12px;text-decoration:underline;padding:8px}

<script>
const T=[
 {n:'手搖飲',e:'🧋',c:40,b:4,col:'#ff9ec4'},
 {n:'咖啡店',e:'☕',c:120,b:7,col:'#e0a370'},
 {n:'書店',e:'📚',c:250,b:11,col:'#7fdca0'},
 {n:'服飾店',e:'👗',c:600,b:18,col:'#c8a2ff'},
 {n:'餐廳',e:'🍽️',c:1200,b:30,col:'#ffb36b'},
 {n:'小酒館',e:'🍻',c:1500,b:55,col:'#f2c14e'},
 {n:'捷米專賣店',e:'🚇',c:2500,b:100,col:'#4fa3ff',jemi:1}];
const MULT=[0,1,2.5,8,18],UP=[0,0,2,6,15],FI=[1,1.15,1.3,1.5],FC=[1,1.2,1.5,2],TIER=['','銅','銀','金','金+皇冠'],TH=[6,14,24,34,44];
const UNL=4;
const PEOPLE=['🧒','👧','👦','👩','👨','🧓','👵','🧑‍🎓','👩‍🦰','🧑‍🦱','🐕','👶'];
const KEY='shilin-tod-v3';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.shops||S.shops.length!==12)S={coins:0,won:0,jemi:0,shops:Array.from({length:12},()=>({t:-1,lv:0,st:0}))};
const $=s=>document.querySelector(s),rnd=a=>a[Math.random()*a.length|0];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fl=i=>i/3|0,fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n);
const CN=n=>'<i class="cn"></i>'+n;
const ocost=(i,t)=>Math.round(T[t].c*FC[fl(i)]);
const ucost=(i,L)=>Math.round(T[S.shops[i].t].c*UP[L]*FC[fl(i)]);
const rcost=i=>Math.max(5,Math.round(T[S.shops[i].t].c*.08));
const inc=i=>{const s=S.shops[i];return s.t<0?0:Math.round(T[s.t].b*MULT[s.lv]*FI[fl(i)])};
const openN=()=>S.shops.filter(s=>s.t>=0).length;
const jemiLv=()=>{const s=S.shops.find(s=>s.t===6);return s?s.lv:0};
function walk(parent,from,to,bottom,size,dur,end){
  const p=document.createElement('div');p.className='p';p.style.cssText=`bottom:${bottom};font-size:${size}px`;
  p.innerHTML='<span>'+rnd(PEOPLE)+'</span>';parent.appendChild(p);
  const f=from<to?1:-1,t=s=>`translateX(-50%) scaleX(${f}) scale(${s})`;
  p.animate([{left:from+'%',opacity:1,transform:t(1)},{left:to+'%',opacity:1,transform:t(.85),offset:.88},{left:to+'%',opacity:0,transform:t(.2)}],{duration:dur,easing:'linear'}).onfinish=()=>{p.remove();end&&end()};
}
function pop(parent,html,x,y,fixed){const e=document.createElement('div');e.className='pop';e.innerHTML=html;e.style.left=x+'px';e.style.top=y+'px';if(fixed)e.style.position='fixed';parent.appendChild(e);setTimeout(()=>e.remove(),1000)}
// 樓層頁
let cur=0;const fe=$('#floors'),tabs=$('#tabs');
for(let f=0;f<4;f++){
  const d=document.createElement('div');d.className='fp';d.id='fp'+f;
  d.innerHTML=[0,1,2].map(k=>{const i=f*3+k;return `<div class="card" id="c${i}"><div class="frame"><div class="crown">👑</div><div class="store"><div class="awn"></div><div class="ico"></div><div class="plus">＋</div><div class="door"></div><div class="lane"></div></div></div><div class="info"><div class="nm"></div><div class="stk"><i></i></div><div class="sn"></div><div class="btns"><button class="op"></button><button class="up"></button></div></div></div>`}).join('');
  fe.appendChild(d);
  const b=document.createElement('button');b.id='tb'+f;b.innerHTML=`${f+2}F<small></small>`;b.onclick=()=>{cur=f;showFloor();$('#main').scrollTop=0};tabs.appendChild(b);
}
function showFloor(){for(let f=0;f<4;f++){$('#fp'+f).classList.toggle('on',f===cur);$('#tb'+f).classList.toggle('on',f===cur)}}
S.shops.forEach((sh,i)=>{const d=$('#c'+i);
  d.querySelector('.store').onclick=()=>{if(S.shops[i].t<0)openPicker(i)};
  d.querySelector('.op').onclick=()=>{const sh=S.shops[i];
    if(sh.t<0)return openPicker(i);
    if(S.coins>=rcost(i)&&sh.st<20){S.coins-=rcost(i);sh.st=Math.min(20,sh.st+10)}render()};
  d.querySelector('.up').onclick=()=>{const sh=S.shops[i];
    if(sh.t>=0&&sh.lv<4&&S.coins>=ucost(i,sh.lv+1)){S.coins-=ucost(i,sh.lv+1);sh.lv++;pop(d,['','','🥈升級!','🥇升級!','👑滿級!'][sh.lv],30,10)}render()};
});
// 選店種
let pick=-1;
function openPicker(i){pick=i;const un=S.jemi||openN()>=UNL;
  $('#opts').innerHTML=T.map((t,k)=>{
    const has=t.jemi&&S.shops.some(s=>s.t===6),lock=t.jemi&&!un,c=ocost(i,k);
    const sub=lock?`🔒 先開滿 ${UNL} 間店才能解鎖`:has?'已經開過了（全商場限 1 間）':`每位客人約 +${Math.round(t.b*FI[fl(i)])}`+(t.jemi?'｜每級招攬 +8':'');
    return `<button class="opt" data-k="${k}" ${lock||has||S.coins<c?'disabled':''}><span class="e">${t.jemi?'<i class="jmimg"></i>':t.e}</span><span><b>${t.n}</b><small>${sub}</small></span><span class="pr">${CN(c)}</span></button>`}).join('');
  $('#pk').classList.add('on');
}
$('#opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;const k=+b.dataset.k,i=pick,c=ocost(i,k);
  if(S.coins<c)return;S.coins-=c;Object.assign(S.shops[i],{t:k,lv:1,st:10});if(openN()>=UNL)S.jemi=1;
  $('#pk').classList.remove('on');pop($('#c'+i),'🎉開張!',30,10);render()};
$('#cx').onclick=()=>$('#pk').classList.remove('on');
$('#pk').onclick=e=>{if(e.target.id==='pk')$('#pk').classList.remove('on')};
function stars(){const tot=S.shops.reduce((a,s)=>a+s.lv,0);return[tot,TH.filter(x=>tot>=x).length]}
function render(){
  $('#coinchip').innerHTML=CN(fmt(S.coins));
  const[tot,st]=stars();$('#stars').textContent='⭐ '+st+'/5';
  const nx=TH.find(x=>tot<x);
  $('#tip').textContent=(S.jemi?'捷米專賣店已解鎖':`開滿 ${UNL} 間店解鎖捷米專賣店（${openN()}/${UNL}）`)+(nx?`｜總等級 ${tot}/${nx} 拿下一顆星`:'');
  $('#go').innerHTML='📣 招攬客人 +'+(10+jemiLv()*8);
  const dot=[0,0,0,0],cnt=[0,0,0,0];
  S.shops.forEach((sh,i)=>{const d=$('#c'+i),t=T[sh.t],op=d.querySelector('.op'),up=d.querySelector('.up'),f=fl(i);
    d.querySelector('.frame').className='frame t'+(sh.t<0?0:sh.lv);
    const stor=d.querySelector('.store');stor.style.setProperty('--c',t?t.col:'#ccc');stor.classList.toggle('jm',!!(t&&t.jemi));
    d.querySelector('.ico').textContent=t?t.e:'';
    d.querySelector('.stk i').style.width=sh.st*5+'%';
    op.classList.remove('can');up.classList.remove('can');
    if(sh.t<0){d.querySelector('.nm').innerHTML='空店面';d.querySelector('.sn').textContent='點左邊店面選店種';op.innerHTML='🏪 開店';op.disabled=false;up.textContent='—';up.disabled=true}
    else{cnt[f]++;d.querySelector('.nm').innerHTML=(t.jemi?'<i class="jmimg s"></i>':'')+t.n+`<small>${TIER[sh.lv]}</small>`;
      d.querySelector('.sn').innerHTML=sh.st?`庫存 ${sh.st}｜每位 ${CN(inc(i))}`:'⚠️ 缺貨！快進貨';
      op.innerHTML='📦 進貨 '+CN(rcost(i));op.disabled=S.coins<rcost(i)||sh.st>=20;
      if(sh.st===0&&!op.disabled){op.classList.add('can');dot[f]=1}
      if(sh.lv<4){const c=ucost(i,sh.lv+1);up.innerHTML='⬆'+['','銀','金','皇冠'][sh.lv]+' '+CN(fmt(c));up.disabled=S.coins<c;if(!up.disabled){up.classList.add('can');dot[f]=1}}
      else{up.textContent='👑 滿級';up.disabled=true}}
  });
  for(let f=0;f<4;f++){const b=$('#tb'+f);b.querySelector('small').textContent=cnt[f]+'/3 店';b.classList.toggle('dot',!!dot[f]&&f!==cur)}
  if(st>=5&&!S.won){S.won=1;fireworks()}
  save();
}
function spawnScene(){const l=Math.random()<.5;walk($('#people'),l?-4:104,49,'8%',20+Math.random()*6,2600+Math.random()*1200)}
let combo=0,last=0;
$('#go').onpointerdown=e=>{e.preventDefault();const now=Date.now();combo=now-last<900?combo+1:1;last=now;
  const m=Math.min(3,1+Math.floor(combo/4)*.5),g=Math.round((10+jemiLv()*8)*m);
  S.coins+=g;for(let k=0;k<2;k++)setTimeout(spawnScene,k*250);
  pop(document.body,'+'+g+CN(''),e.clientX-14,e.clientY-40,1);
  const c=$('#combo');if(m>1){c.style.display='block';c.textContent='🔥 連擊 x'+m}else c.style.display='none';render()};
setInterval(()=>{if(Date.now()-last>1200)$('#combo').style.display='none'},500);
const TD=15000,TC=45000;let tUntil=0,tReady=0;
const crowd=()=>Date.now()<tUntil?2:1;
function spawnTrain(){const p=document.createElement('div');p.className='p';p.style.fontSize='18px';p.innerHTML='<span>'+rnd(PEOPLE)+'</span>';$('#people').appendChild(p);
  p.animate([{left:'61%',bottom:'38%',opacity:0,transform:'translateX(-50%) scale(.5)'},{opacity:1,offset:.15,transform:'translateX(-50%) scale(.8)'},{left:'49%',bottom:'8%',opacity:1,offset:.88,transform:'translateX(-50%) scale(1)'},{left:'49%',bottom:'8%',opacity:0,transform:'translateX(-50%) scale(.2)'}],{duration:2600,easing:'linear'}).onfinish=()=>p.remove()}
function trainGo(){const now=Date.now();if(now<tReady)return;tUntil=now+TD;tReady=now+TD+TC;
  const t=$('#train');t.getAnimations().forEach(a=>a.cancel());t.style.display='block';
  t.animate([{left:'112%',top:'33%'},{left:'60%',top:'58%'}],{duration:2200,easing:'ease-out',fill:'forwards'});
  for(let k=0;k<6;k++)setTimeout(spawnTrain,2200+k*220);
  setTimeout(()=>{t.getAnimations().forEach(a=>a.cancel());t.animate([{left:'60%',top:'58%'},{left:'112%',top:'33%'}],{duration:2200,easing:'ease-in',fill:'forwards'}).onfinish=()=>{t.style.display='none'}},TD);
  trUI()}
function trUI(){const now=Date.now(),b=$('#tr');
  $('#rush').style.display=now<tUntil?'block':'none';
  b.classList.remove('rdy','on');
  if(now<tUntil){b.disabled=true;b.classList.add('on');b.innerHTML='🚇 人潮x2<br>'+Math.ceil((tUntil-now)/1000)+'s'}
  else if(now<tReady){b.disabled=true;b.innerHTML='🚇 列車準備中<br>'+Math.ceil((tReady-now)/1000)+'s'}
  else{b.disabled=false;b.classList.add('rdy');b.innerHTML='🚇 列車到站<br>人潮 x2'}}
$('#tr').onpointerdown=e=>{e.preventDefault();trainGo()};
setInterval(trUI,250);trUI();
['gesturestart','gesturechange','gestureend','dblclick'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
function tick(){
  const c=crowd();
  if(c===2&&Math.random()<.6)spawnTrain();else spawnScene();
  const open=S.shops.map((s,i)=>i).filter(i=>S.shops[i].t>=0&&S.shops[i].st>0);
  const n=1+Math.floor(openN()/4);
  for(let k=0;k<n&&open.length;k++){const i=open.splice(Math.random()*open.length|0,1)[0],d=$('#c'+i);
    if(fl(i)===cur)walk(d.querySelector('.lane'),Math.random()<.5?-10:110,50,'2px',17,1600,()=>sell(i));
    else setTimeout(()=>sell(i),1600)}
  setTimeout(tick,Math.max(450,1400-stars()[0]*20)/c);
}
function sell(i){const sh=S.shops[i];if(sh.t<0||sh.st<=0)return;sh.st--;const g=inc(i);S.coins+=g;
  if(fl(i)===cur)pop($('#c'+i),'+'+fmt(g)+CN(''),30,20);
  const ch=$('#coinchip');ch.style.transform='scale(1.12)';setTimeout(()=>ch.style.transform='',120);render()}
// 煙火
const cv=$('#cv'),cx=cv.getContext('2d');let P=[],fwEnd=0,fwRun=0;
function burst(x,y){const h=Math.random()*360,n=70;for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.2,s=1.5+Math.random()*4;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:h+Math.random()*40})}}
function fwLoop(){
  cx.globalCompositeOperation='destination-out';cx.fillStyle='rgba(0,0,0,.18)';cx.fillRect(0,0,cv.width,cv.height);
  cx.globalCompositeOperation='lighter';
  P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.985;p.l-=.012;cx.fillStyle=`hsla(${p.h},100%,60%,${p.l})`;cx.beginPath();cx.arc(p.x,p.y,2.2,0,7);cx.fill()});
  if(Date.now()<fwEnd&&Math.random()<.06)burst(Math.random()*cv.width,Math.random()*cv.height*.6+40);
  if(fwRun)requestAnimationFrame(fwLoop)}
function fireworks(){cv.width=innerWidth;cv.height=innerHeight;$('#fwbox').classList.add('on');P=[];fwEnd=Date.now()+12000;fwRun=1;
  for(let k=0;k<5;k++)setTimeout(()=>burst(Math.random()*cv.width,Math.random()*cv.height*.5+60),k*300);fwLoop()}
$('#fwbox').onclick=()=>{fwRun=0;$('#fwbox').classList.remove('on')};
$('#rs').onclick=()=>{if(confirm('確定要重新開始嗎？')){localStorage.removeItem(KEY);location.reload()}};
showFloor();render();tick();
</script></body></html>
